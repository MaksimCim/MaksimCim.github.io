<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-poly карта маршрута</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Alegreya+Sans:wght@400;500;700&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE everyday travel tool that tells stories: calm, tactile, made for a tour company's site
   IDEA the painted relief model of a visitor centre plus a pocket guidebook page for every stop
   PICTURE full-bleed 3D diorama with route and pins; each stop opens with its own low-poly postcard
   COLOUR sky haze to warm horizon; meadow, forest and rock from the land; route orange as the only accent
   TYPE Oswald (trail-sign condensed) for names and figures + Alegreya / Alegreya Sans for stories and interface
   LAYOUT laptop: map, story column on the right, elevation profile under the map; phone: sticky map, steps, profile, story */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#10171c);
--ink:light-dark(#1b2621,#e8eee9);
--mute:light-dark(#56655e,#9aa9a2);
--line:light-dark(#e1e5e0,#26323b);
--soft:light-dark(#f2f4f0,#19232b);
--acc:light-dark(#ee5019,#ff7a45);
--accs:light-dark(#ffe6da,#3b241a);
--sky1:light-dark(#b7daea,#0a1421);
--sky2:light-dark(#efe9dc,#1d2b3a);
--glass:light-dark(rgba(255,255,255,.88),rgba(16,23,28,.86));
--disp:Oswald,'Arial Narrow',sans-serif;
--sans:'Alegreya Sans',system-ui,sans-serif;
--serif:Alegreya,Georgia,serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr) auto}
#map{grid-area:1/1/2/2;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 75%)}
#map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#pins{position:absolute;inset:0;pointer-events:none;z-index:1}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;height:30px;min-width:30px;padding:0 10px;justify-content:center;border-radius:15px;border:2px solid #fff;background:#1b2621;color:#fff;font:600 15px/1 var(--disp);cursor:pointer;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.pin .nm{display:none;font:500 15px/1 var(--disp)}
.pin.on{background:var(--acc)}
.pin.on .nm{display:inline}
#head{position:absolute;left:20px;top:18px;right:20px;max-width:600px;pointer-events:none;z-index:2}
h1{font:600 clamp(30px,3.8vw,48px)/1.05 var(--disp);letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance;text-shadow:0 0 14px var(--bg),0 0 4px var(--bg)}
.sub{display:inline-block;margin:0 0 10px;color:var(--mute);font-size:15px;background:var(--glass);border-radius:8px;padding:2px 8px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 10px;line-height:1.2}
.stat b{display:block;font:600 18px/1.2 var(--disp);white-space:nowrap}
.stat span{font-size:14px;color:var(--mute)}
.hint{position:absolute;left:16px;bottom:16px;margin:0;font-size:14px;color:var(--mute);z-index:2;pointer-events:none;background:var(--glass);border-radius:8px;padding:3px 9px}
.err{position:absolute;inset:auto 20px 50% 20px;text-align:center;font-weight:700}
#panel{grid-area:1/2/3/3;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
.steps-w{padding:16px 16px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.steps-w h2{font:500 17px/1.2 var(--disp);margin:0 0 10px}
#steps{display:flex;justify-content:space-between;list-style:none;margin:0;padding:0;position:relative}
#steps::before{content:"";position:absolute;left:22px;right:22px;top:21px;height:2px;background:var(--line)}
.st{position:relative;width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);background:var(--soft);font:600 17px/1 var(--disp);cursor:pointer}
.st:hover{background:var(--line)}
.st.done{background:var(--accs)}
.st.on{background:var(--acc);color:#fff}
#story{flex:1;overflow:auto}
.pc svg{display:block;width:100%;height:150px}
.sb{padding:16px 20px 22px}
.kd{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;border-radius:14px;padding:3px 11px 3px 8px;font-weight:700}
.pill svg{width:16px;height:16px}
#story h2{font:600 32px/1.05 var(--disp);margin:10px 0 14px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-block:1px solid var(--line);padding:10px 0}
.facts b{display:block;font:500 18px/1.2 var(--disp);white-space:nowrap}
.facts span{font-size:14px;color:var(--mute)}
.lead{font:italic 20px/1.4 var(--serif);margin:16px 0 6px}
#story h3{font:500 19px/1.2 var(--disp);margin:20px 0 8px}
.sb>p{font:17.5px/1.6 var(--serif);margin:0 0 10px}
.see{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.see li{display:flex;gap:10px;align-items:baseline}
.see li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--acc);transform:translateY(-1px)}
.tip{display:flex;gap:12px;background:var(--accs);border-radius:12px;padding:12px 14px;margin-top:20px}
.tip svg{flex:none;width:22px;height:22px;color:var(--acc);margin-top:2px}
.tip b{display:block;font:500 17px/1.2 var(--disp);margin-bottom:3px}
.tip p{margin:0}
.note{font-size:14px;color:var(--mute);margin:16px 0 0}
.nav{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;justify-content:center}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .pc svg{filter:brightness(.72) saturate(.85)}}
:root[data-theme=dark] .pc svg{filter:brightness(.72) saturate(.85)}
#prof{grid-area:2/1/3/2;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg)}
.ctr{display:flex;flex-direction:column;gap:8px}
.btn{height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);padding:0 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:focus-visible,.st:focus-visible,.pin:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fig{position:relative;height:120px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;cursor:ew-resize;touch-action:none;overflow:visible}
.ar{fill:var(--accs)}
.ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round}
.gl{stroke:var(--line)}
.ax{font:14px var(--sans);fill:var(--mute)}
.cl{stroke:var(--mute);stroke-dasharray:2 3;opacity:.7}
.cd{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.cb{cursor:pointer}
.cb circle{fill:var(--soft);stroke:var(--line)}
.cb text{font:600 14px var(--disp);fill:var(--ink)}
.cb.on circle{fill:var(--acc);stroke:var(--acc)}
.cb.on text{fill:#fff}
.phl{stroke:var(--ink);stroke-width:1.5}
.phd{fill:var(--acc);stroke:var(--bg);stroke-width:2}
.pht{font:700 14px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
@media(max-width:760px){
html,body{height:auto}
body{overflow:auto}
#app{display:flex;flex-direction:column;height:auto}
#map{position:sticky;top:0;height:max(50svh,300px);flex:none;z-index:5}
#prof{order:2;gap:10px;padding:8px 12px 10px}
#panel{order:3;display:block;border-left:0}
.steps-w{position:sticky;top:max(50svh,300px);z-index:4;padding:8px 12px}
.steps-w h2,.hint,.sub{display:none}
#story{overflow:visible}
.sb{padding:14px 16px 18px}
#story h2{font-size:28px}
.facts{grid-template-columns:repeat(2,minmax(0,1fr))}
.ctr .btn .lb{display:none}
.ctr .btn{width:44px;padding:0;justify-content:center}
.fig{height:96px}
#head{left:14px;top:12px;right:14px}
h1{font-size:26px}
.stat{padding:4px 8px}
.stat b{font-size:16px}
.stat span{font-size:13px}
}
@media(max-width:480px){.stat:nth-child(4){display:none}}
</style>
</head>
<body>
<div id="app">
  <section id="map" aria-label="3D-карта маршрута">
    <div id="pins"></div>
    <header id="head">
      <h1>Орлиный гребень</h1>
      <p class="sub">Пеший маршрут на 2 дня, 7 точек</p>
      <div class="stats" id="stats"></div>
    </header>
    <p class="hint">Тяните, чтобы вращать. Колесо меняет масштаб, правая кнопка двигает карту.</p>
  </section>
  <aside id="panel">
    <div class="steps-w"><h2>Точки маршрута</h2><ol id="steps"></ol></div>
    <article id="story" aria-live="polite"></article>
    <div class="nav"><button class="btn" id="prev" type="button">← Назад</button><button class="btn" id="next" type="button">Дальше →</button></div>
  </aside>
  <section id="prof" aria-label="Профиль высот">
    <div class="ctr">
      <button class="btn pri" id="play" type="button"></button>
      <button class="btn" id="home" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lb">Обзор</span></button>
    </div>
    <div class="fig" id="fig"><svg id="svg" role="img" aria-label="Профиль высот маршрута, можно перетаскивать"></svg></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mapEl=$('#map');
const fmtN=n=>Math.round(n).toLocaleString('ru-RU');
const km=m=>(m/1000).toFixed(1).replace('.',',');
const dur=h=>{let m=Math.round(h*12)*5;const hh=Math.floor(m/60);m%=60;return hh?hh+' ч'+(m?' '+m+' мин':''):m+' мин';};
const ICONS={
  home:'M4 11l8-7 8 7M6 10v10h12V10',
  drop:'M12 3c-3 4.5-6 8-6 11a6 6 0 0 0 12 0c0-3-3-6.5-6-11z',
  eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  pass:'M2 19l6-10 4 5 3-3 7 8',
  peak:'M3 20l9-15 9 15zM12 5V1l5 2-5 2',
  hut:'M3 12l9-8 9 8M5 10v10h14V10M10 20v-5h4v5',
  tent:'M3 20L12 4l9 16zM12 4v16M9 20l3-5 3 5',
  tip:'M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z'
};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="${ICONS[k]}"/></svg>`;
const CP=[
  {n:'Посёлок Озёрный',k:'Старт',ic:'home',stop:'40 мин',
   lead:'Посёлок вырос из зимовья пастухов и до сих пор живёт по их календарю.',
   story:['Первые дома здесь поставили в конце XIX века. Пастухи уводили отары на летние луга за хребтом, а на зиму возвращались к озеру, где снег ложится позже. Каменная кошара на окраине стоит до сих пор, сейчас в ней прокат снаряжения.',
          'Местные уверяют, что озеро никогда не замерзает целиком: посередине остаётся тёмная полынья, которую называют «глазом». Рыбаки объясняют её подводным ключом, старики говорят, что так озеро присматривает за посёлком.'],
   see:['Каменная кошара 1890-х','Причал с видом на весь хребет','Лавка с домашним сыром'],
   tip:'Позавтракайте плотно: следующий полноценный привал только на смотровой.'},
  {n:'Родник',k:'Вода',ic:'drop',stop:'15 мин',
   lead:'Холодный ключ, у которого веками останавливались по дороге к перевалу.',
   story:['Вода выходит из-под корней старой берёзы и круглый год держится около +4 °C. Каменную чашу вокруг выложили студенты-геологи в 1960-х: они искали здесь медь, а нашли только эту воду.',
          'Есть примета: сделай три глотка и не оглядывайся на посёлок, тогда до перевала не будет дождя. Гиды над приметой посмеиваются, но три глотка делают все.'],
   see:['Каменная чаша геологов','Берёза с ленточками от прошлых групп'],
   tip:'Наберите 1,5–2 л воды на человека: выше источников нет до самого приюта.'},
  {n:'Смотровая «Озёрная»',k:'Вид',ic:'eye',stop:'30 мин',
   lead:'Первое место, откуда виден весь путь: озеро внизу и перевал наверху.',
   story:['Выступ зовут «Кафедрой». Сто лет назад первый местный проводник читал отсюда гостям лекции о ледниках и показывал рукой, где когда-то кончался лёд. Морена, о которой он рассказывал, хорошо видна до сих пор: это длинный вал у восточного берега.',
          'Отсюда видно, как река уходит из озера на восток. По цвету воды гиды угадывают погоду наверху: если весной вода мутнеет, значит на хребте тепло и тает снег.'],
   see:['Панорама озера и посёлка','Перевал Ветреный на горизонте','Каменный тур с записками туристов'],
   tip:'Лучшее место для общего фото: до полудня солнце светит из-за спины.'},
  {n:'Перевал Ветреный',k:'Перевал',ic:'pass',stop:'15 мин',
   lead:'Седловина, через которую столетиями ходили из одной долины в другую.',
   story:['До появления дороги перевал был самым коротким путём в соседнюю долину. Через него гнали скот и носили соль, а на седловине до сих пор лежат камни старой вьючной тропы, уложенные ступенями.',
          'Имя у перевала честное. Тёплый воздух из долины весь день перетекает через самую низкую точку хребта, поэтому ветер здесь дует почти всегда, и даже в июле наверху бывает по-осеннему холодно.'],
   see:['Ступени старой вьючной тропы','Вид сразу на обе долины'],
   tip:'Ветровку надевайте до выхода на седловину, а не на ней. Наверху стоим не дольше 15 минут.'},
  {n:'Вершина Орлиная',k:'Вершина',ic:'peak',stop:'40 мин',
   lead:'Высшая точка маршрута, над которой почти всегда кружат беркуты.',
   story:['Вершину назвали по беркутам, которые гнездятся на скалах северного склона. В ясный день пару птиц видно почти всегда: они набирают высоту на тёплых потоках с южных лугов.',
          'Первыми сюда поднялись топографы в 1930-х, они ставили геодезический знак. Его бетонное основание сохранилось на самой макушке, а рядом в железной коробке лежит журнал, куда восходители записывают свои имена.'],
   see:['Основание геодезического знака','Журнал восходителей','Беркуты над северным склоном'],
   tip:'Последние 300 м по осыпи идём в касках и только за гидом.'},
  {n:'Кедровый приют',k:'Ночёвка',ic:'hut',stop:'ночёвка',
   lead:'Деревянный домик в кедровнике, где заканчивается первый день.',
   story:['Приют срубили лесники в 1970-х как кордон для наблюдения за пожарами. Позже его отдали туристам, но на чердаке остались старый бинокль и журнал дежурств с записями о каждой грозе.',
          'Вечером гиды топят печь и рассказывают главную историю приюта: однажды зимой кордон на месяц завалило снегом, и лесник продержался на кедровых орехах и сушёных грибах. Орехи здесь собирают до сих пор, в сентябре.'],
   see:['Печь и общий стол на 12 человек','Закат над хребтом с крыльца','Кедры, которым больше 200 лет'],
   tip:'Возьмите тёплую одежду на вечер: после заката температура падает быстро.'},
  {n:'Лагерь у реки',k:'Финиш',ic:'tent',stop:'финиш',
   lead:'Стоянка у старого брода, где маршрут заканчивается.',
   story:['Пока ниже по течению не построили мост, брод был главным переходом через реку. В конце лета, когда вода падает, на дне видна каменная мостовая: её выкладывали, чтобы телеги не вязли в иле.',
          'Перед трансфером группа обедает у костровища. По традиции каждый кладёт в тур у лагеря камень, принесённый с вершины, и тур растёт с каждым сезоном.'],
   see:['Каменная мостовая старого брода','Тур из камней с Орлиной','Тихий плёс для купания'],
   tip:'Купаться только в плёсе ниже лагеря: на броде сильное течение.'}
];
if(!window.THREE||!THREE.OrbitControls){mapEl.insertAdjacentHTML('beforeend','<p class="err">Не загрузилась библиотека Three.js</p>');}
else{
/* ---------- terrain ---------- */
const SEED=7;let sd=12345;
const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
const hash=(x,y)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(SEED,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;};
const vn=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
const fbm=(x,y,o)=>{let s=0,a=.5,n=0;for(let i=0;i<o;i++){s+=a*vn(x,y);n+=a;a*=.5;x*=2.03;y*=2.03;}return s/n;};
const ridged=(x,y,o)=>{let s=0,a=.5,n=0;for(let i=0;i<o;i++){s+=a*(1-Math.abs(2*vn(x,y)-1));n+=a;a*=.5;x*=2.1;y*=2.1;}return s/n;};
const g2=(x,z,cx,cz,r)=>Math.exp(-((x-cx)**2+(z-cz)**2)/(r*r));
const S=200,N=100,CELL=S/N,W=7,ALT0=900,MY=38,MXZ=60;
function hRaw(x,z){
  const base=fbm(x*.013+3.1,z*.013+7.7,5);
  const zr=-.35*x-15+12*Math.sin(x*.03);
  const range=Math.exp(-(((z-zr)/30)**2));
  const back=Math.exp(-(((z+78)/20)**2));
  const pk=ridged(x*.024+11,z*.024+5,4);
  let h=6+base*16+range*(18+pk*24)+back*(8+pk*14);
  h-=g2(x,z,-46,50,26)*18;
  const rz=55+.25*x+8*Math.sin(x*.05);
  h-=Math.exp(-(((z-rz)/7)**2))*12*Math.min(1,Math.max(0,(x+40)/20));
  h-=g2(x,z,10,-14,13)*12;
  h+=g2(x,z,38,-18,11)*12;

  active=i;
  stepEls.forEach((b,k)=>{b.classList.toggle('on',k===i);b.classList.toggle('done',k<i);});
  pinEls.forEach((b,k)=>b.classList.toggle('on',k===i));
  document.querySelectorAll('.cb').forEach(g=>g.classList.toggle('on',+g.dataset.i===i));
  renderStory(i);
  $('#prev').disabled=i===0;$('#next').disabled=i===CP.length-1;
  if(!narrow())story.scrollTop=0;
}
function select(i,fly){
  playing=false;updPlay();setActive(i);setT(cps[i].si/NS);
  if(fly)flyTo(cps[i].base,narrow()?120:95);
  if(narrow()){const line=mapEl.offsetHeight+$('.steps-w').offsetHeight,top=story.getBoundingClientRect().top;if(top<line)scrollTo({top:scrollY+top-line,behavior:reduce?'auto':'smooth'});}
}
const mp=new THREE.Vector3();
function setT(v){
  t=Math.min(1,Math.max(0,v));const f=t*NS,i0=Math.min(NS-1,Math.floor(f)),u=f-i0;
  mp.lerpVectors(sp[i0],sp[i0+1],u);marker.position.copy(mp);updPH();
}
stepEls.forEach(b=>b.onclick=()=>select(+b.dataset.i,true));
$('#prev').onclick=()=>select(Math.max(0,active-1),true);
$('#next').onclick=()=>select(Math.min(CP.length-1,active+1),true);
$('#home').onclick=home;
playBtn.onclick=()=>{
  if(playing){playing=false;updPlay();return;}
  if(t>=.999){setT(0);setActive(0);}
  playing=true;updPlay();flyTo(marker.position,narrow()?150:120);
};

/* ---------- elevation profile ---------- */
const fig=$('#fig'),svg=$('#svg');let pg=null;
const step=maxAlt-minAlt>1600?1000:500,a0=Math.floor((minAlt-60)/step)*step,a1=Math.ceil((maxAlt+60)/step)*step;
function drawProf(){
  const w=fig.clientWidth,h=fig.clientHeight;if(!w||!h)return;
  const L=w<520?42:58,R=10,T=26,B=22;
  const X=d=>L+d/total*(w-L-R),Y=a=>T+(1-(a-a0)/(a1-a0))*(h-T-B);
  let line='';for(let k=0;k<=NS;k+=4)line+=(k?'L':'M')+X(cum[k]).toFixed(1)+' '+Y(alt[k]).toFixed(1);
  let g='';
  for(let a=a0;a<=a1;a+=step)g+=`<line class="gl" x1="${L}" x2="${w-R}" y1="${Y(a)}" y2="${Y(a)}"/><text class="ax" x="${L-6}" y="${Y(a)+4}" text-anchor="end">${fmtN(a)}${w>=520&&a===a1?' м':''}</text>`;
  const ks=w<520?4:2;for(let k=ks;k<total/1000-.6;k+=ks)g+=`<text class="ax" x="${X(k*1000)}" y="${h-5}" text-anchor="middle">${k} км</text>`;
  cps.forEach((c,i)=>{const x=X(cum[c.si]),y=Y(alt[c.si]);g+=`<line class="cl" x1="${x}" x2="${x}" y1="22" y2="${y}"/><circle class="cd" cx="${x}" cy="${y}" r="3.5"/><g class="cb${i===active?' on':''}" data-i="${i}"><circle cx="${x}" cy="11" r="10"/><text x="${x}" y="16" text-anchor="middle">${i+1}</text></g>`;});
  svg.innerHTML=`<path class="ar" d="${line}L${X(total)} ${h-B}L${L} ${h-B}Z"/>${g}<path class="ln" d="${line}"/><g id="ph"><line class="phl" y1="${T-4}" y2="${h-B}"/><circle class="phd" r="5"/><text class="pht"></text></g>`;
  pg={L,R,T,B,w,h,X,Y,ln:svg.querySelector('.phl'),dot:svg.querySelector('.phd'),tx:svg.querySelector('.pht')};
  updPH();
}
function updPH(){
  if(!pg)return;const k=Math.round(t*NS),x=pg.X(cum[k]),y=pg.Y(alt[k]),r=x>pg.w-150;
  pg.ln.setAttribute('x1',x);pg.ln.setAttribute('x2',x);pg.dot.setAttribute('cx',x);pg.dot.setAttribute('cy',y);
  pg.tx.setAttribute('x',r?x-9:x+9);pg.tx.setAttribute('y',pg.T+12);pg.tx.setAttribute('text-anchor',r?'end':'start');
  pg.tx.textContent=`${fmtN(alt[k])} м, ${km(cum[k])} км`;
}
let drag=false;
function scrub(e){
  const r=svg.getBoundingClientRect(),f=Math.min(1,Math.max(0,(e.clientX-r.left-pg.L)/(r.width-pg.L-pg.R)))*total;
  let lo=0,hi=NS;while(lo<hi){const m=(lo+hi)>>1;if(cum[m]<f)lo=m+1;else hi=m;}
  playing=false;updPlay();setT(lo/NS);
  let a=0;cps.forEach((c,i)=>{if(c.si<=lo+2)a=i;});if(a!==active)setActive(a);
}
svg.addEventListener('pointerdown',e=>{
  const cb=e.target.closest('.cb');if(cb){select(+cb.dataset.i,true);return;}
  if(!pg)return;drag=true;svg.setPointerCapture(e.pointerId);scrub(e);
});
svg.addEventListener('pointermove',e=>{if(drag)scrub(e);});
svg.addEventListener('pointerup',()=>{drag=false;});
svg.addEventListener('pointercancel',()=>{drag=false;});

/* ---------- loop ---------- */
const v=new THREE.Vector3(),dv=new THREE.Vector3();
function resize(){const w=mapEl.clientWidth,h=mapEl.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
const roMap=new ResizeObserver(resize);roMap.observe(mapEl);
const roFig=new ResizeObserver(drawProf);roFig.observe(fig);
resize();
camera.position.copy(HOME_T).add(HOME_D.clone().multiplyScalar(homeDist()));
function updPins(){
  const w=mapEl.clientWidth,h=mapEl.clientHeight;
  cps.forEach((c,i)=>{
    const el=pinEls[i];v.copy(c.top).project(camera);
    if(v.z>1||Math.abs(v.x)>1.05||Math.abs(v.y)>1.05){el.style.display='none';return;}
    el.style.display='';el.style.transform=`translate(${((v.x*.5+.5)*w).toFixed(1)}px,${((-v.y*.5+.5)*h).toFixed(1)}px) translate(-50%,-100%)`;
    el.style.zIndex=String((i===active?1e6:0)+Math.round((1-v.z)*1e5));
  });
}
const clock=new THREE.Clock();
const DUR=32;
function loop(){
  const dt=Math.min(clock.getDelta(),.05);
  if(!reduce)tex.offset.x-=dt*.5;
  if(tw){tw.k=Math.min(1,tw.k+dt/1.2);const e=ease(tw.k);controls.target.lerpVectors(tw.t0,tw.t1,e);camera.position.lerpVectors(tw.c0,tw.c1,e);if(tw.k>=1)tw=null;}
  else if(playing){
    setT(t+dt/DUR);
    dv.copy(marker.position).sub(controls.target).multiplyScalar(1-Math.exp(-dt*2.5));controls.target.add(dv);camera.position.add(dv);
    const si=Math.round(t*NS);let a=0;cps.forEach((c,i)=>{if(c.si<=si)a=i;});if(a!==active)setActive(a);
    if(t>=1){playing=false;updPlay();}
  }
  controls.update();
  const tg=controls.target;tg.x=Math.min(95,Math.max(-95,tg.x));tg.z=Math.min(95,Math.max(-95,tg.z));tg.y=Math.min(45,Math.max(0,tg.y));
  renderer.render(scene,camera);updPins();
  requestAnimationFrame(loop);
}
updPlay();setActive(active);setT(cps[active].si/NS);drawProf();
loop();
}
}
}
</script>
</body>
